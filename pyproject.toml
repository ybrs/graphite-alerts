[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[project]
name = "graphitealerts"
version = "0.1.0"
description = "Send PagerDuty alerts based on Graphite metrics"
readme = "README.md"
requires-python = ">=3.15"
dependencies = [
    "Flask==3.1.3",
    "Flask-SQLAlchemy==3.1.1",
    "Jinja2==3.1.6",
    "pagerduty==7.0.1",
    "PyYAML==6.0.3",
    "redis==8.1.0",
    "requests==2.34.2",
    "python-simple-hipchat==0.4.0",
    "SQLAlchemy==2.1.6",
]

[project.scripts]
graphite-alerts = "graphitealerts.worker:run"
alerts-dev-server = "graphitealerts.app:run"

[project.optional-dependencies]
dev = ["pytest", "pytest-cov"]

[tool.setuptools.packages.find]
include = ["graphitealerts*"]

[tool.setuptools.package-data]
graphitealerts = ["templates/*.html", "static/**/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
